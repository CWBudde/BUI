# The Go binding (bindings/go): formatting, lint, tests on the wasm engine on Linux, with its
# X11 host and real input, and headless on macOS, tests on the cgo engine on Linux, and a
# byte-for-byte rebuild of the committed bui_kit.wasm. Only changes to the binding or to
# this file run it; BUI's own jobs are in ci.yml.

name: go

on:
  push:
    branches: [main]
    paths: ["bindings/go/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["bindings/go/**", ".github/workflows/go.yml"]

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/go

jobs:
  format:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod

      - uses: extractions/setup-just@v4

      - name: Install formatters
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          just setup-deps

      - name: Check formatting
        run: just check-formatted

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod

      - name: Check tidy
        run: ./scripts/error-on-diff.sh go mod tidy

      # Keep the version in sync with golangci_lint_version in bindings/go/justfile.
      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: bindings/go
          args: --config .golangci.toml --timeout 5m

      # The cgo engine type-checks against the tree's headers; it needs no libraries for that.
      - name: Run linter on the cgo engine
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: bindings/go
          args: --config .golangci.toml --timeout 5m --build-tags bui_cgo

  test-linux:
    name: tests on the wasm engine (Linux)
    runs-on: ubuntu-latest
    steps:
      # The setjmp probe's test builds it from BUI_COMMIT, which a shallow clone lacks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod

      # internal/host/x11 starts an Xvfb of its own, and its tests and the real input change
      # the keyboard layout with setxkbmap.
      - name: Install an X server and input tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool x11-xkb-utils

      - uses: actions/cache@v4
        with:
          path: bindings/go/third_party/dl
          key: wasi-sdk-${{ hashFiles('bindings/go/scripts/build-wasm.sh') }}

      - name: Fetch the pinned wasi-sdk, for the setjmp probe
        run: ./scripts/build-wasm.sh sdk

      - name: Run tests with no cgo at all
        env:
          CGO_ENABLED: "0"
        run: xvfb-run -a go test ./...

      # The X11 host reads events on a goroutine of its own.
      - name: Run the window tests with the race detector
        run: xvfb-run -a go test -race . ./internal/host/x11/

      - name: Send real input
        run: BUI_TEST_XDOTOOL=1 xvfb-run -a go test -race -run '^TestX' .

  test-cgo:
    name: tests on the cgo engine (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod

      - name: Install build tools, the X11 headers, an X server and input tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libx11-dev xvfb xdotool x11-xkb-utils

      # The libraries the tag bui_cgo links ("Engines" in bindings/go/README.md). They come
      # from this checkout, while bui_kit.wasm is BUI_COMMIT's, and the tests compare the two.
      - name: Build BUI's kit
        working-directory: .
        run: |
          cmake -S . -B build -G Ninja -DBUI_BUILD_TESTS=OFF -DBUI_BUILD_EXAMPLES=OFF
          cmake --build build --target bui_kit

      # The Go X11 host against XLookupString, on the layouts the test sets.
      - name: Compare the X11 host's key translation with libX11
        run: go test -tags bui_xlibref ./internal/host/x11/

      # This also compares the engines.
      - name: Run tests with the race detector
        run: xvfb-run -a go test -race -tags bui_cgo ./...

      - name: Send real input
        run: BUI_TEST_XDOTOOL=1 xvfb-run -a go test -race -tags bui_cgo -run '^TestX' .

  test-macos:
    name: tests without cgo (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod

      # Only the Linux x86_64 wasi-sdk is pinned, so the setjmp probe's test skips here.
      - name: Run tests, headless
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  check-wasm:
    name: wasm module matches its sources
    runs-on: ubuntu-latest
    steps:
      # build-wasm.sh takes BUI's sources at BUI_COMMIT from this clone's history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build

      - uses: actions/cache@v4
        with:
          path: bindings/go/third_party/dl
          key: wasi-sdk-${{ hashFiles('bindings/go/scripts/build-wasm.sh') }}

      - name: Rebuild, and check the bytes and the size
        run: ./scripts/check-wasm.sh
